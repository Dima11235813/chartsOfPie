name: Deploy API (Cloudflare Workers)

# Applies D1 migrations and deploys apps/api. Manual only for now: the API is not deployed
# (owner decision 2026-10-11, full stack runs on localhost). Skipped until the repository has the
# CLOUDFLARE_API_TOKEN secret (setup: apps/api/README.md).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Cloudflare not configured yet
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to deploy the API (apps/api/README.md)."
      - uses: actions/checkout@v5
        if: env.HAS_TOKEN == 'true'
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        if: env.HAS_TOKEN == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: env.HAS_TOKEN == 'true'
      - uses: cloudflare/wrangler-action@v3
        if: env.HAS_TOKEN == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: |
            d1 migrations apply charts-of-pie --remote
            deploy
