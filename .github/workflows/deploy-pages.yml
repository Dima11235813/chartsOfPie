name: Deploy to GitHub Pages

# Publishes the web app (front end only) to https://dima11235813.github.io/chartsOfPie/ after CI
# passes on master. One-time setup: repo Settings → Pages → Source: "GitHub Actions".
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only ship commits that passed CI (or a manual run).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fails with a clear message if Pages is not enabled yet (see the one-time setup above).
      - uses: actions/configure-pages@v5
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # The account API (apps/api); empty = accounts hidden. Repo → Settings → Variables.
          VITE_API_URL: ${{ vars.API_URL }}
      # Hash-based links mean every page is index.html; a 404 page that is the app keeps stray
      # paths working too.
      - run: cp apps/web/dist/index.html apps/web/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
